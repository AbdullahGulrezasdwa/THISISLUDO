<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Elite - Pro Edition</title>
    <link rel="stylesheet" href="css/StyleSheet.css">
</head>
<body>
    <div class="main-container">
        <div id="setup-screen" class="ui-panel">
            <h2 style="color: #f1c40f; margin-bottom: 20px;">LUDO ELITE SETUP</h2>
            <div class="setup-group">
                <label>Number of Players:</label>
                <select id="player-count" onchange="toggleNameInputs()">
                    <option value="1">1 Player (Solo)</option>
                    <option value="2" selected>2 Players (Red vs Yellow)</option>
                    <option value="3">3 Players (Red, Green, Yellow)</option>
                    <option value="4">4 Players (All Colors)</option>
                </select>
            </div>
            <div id="name-inputs"></div>
            <button class="start-btn" onclick="startGame()">START GAME</button>
        </div>

        <div id="game-area" style="display:none;">
            <div class="status-board" id="status-board">
                </div>

            <div class="game-board" id="board">
                <img src="images/board.jpg" class="board-bg" alt="Ludo Board">
                <div id="pieces-container"></div>
            </div>

            <div class="ui-panel">
                <div id="status-display">RED'S TURN</div>
                <div id="player-label">Player: ---</div>
                <div class="dice-section">
                    <div id="dice-box" class="dice-box" onclick="rollDice()">⚀</div>
                    <p id="instruction">Click Dice to Roll</p>
                </div>
            </div>
        </div>
    </div>
    <script src="js/ludo.js"></script>
</body>
</html>
