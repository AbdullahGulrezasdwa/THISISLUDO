<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>THIS IS LUDO</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="css/StyleSheet.css">
</head>
<body>

<div id="ludo_main">

    <!-- Board image -->
    <div class="board-wrapper">
        <img src="images/board.jpg" alt="Ludo Board" class="board-img">

        <!-- 15x15 overlay grid -->
        <div class="board-grid">

            <!-- Bottom row (blue side) – t1 at bottom-left, going right -->
            <div class="cell debug" id="t1"></div>
            <div class="cell debug" id="t2"></div>
            <div class="cell debug" id="t3"></div>
            <div class="cell debug" id="t4"></div>
            <div class="cell debug" id="t5"></div>
            <div class="cell debug" id="t6"></div>
            <div class="cell debug"></div>
            <div class="cell debug"></div>
            <div class="cell debug"></div>
            <div class="cell debug"></div>
            <div class="cell debug"></div>
            <div class="cell debug"></div>
            <div class="cell debug"></div>
            <div class="cell debug"></div>
            <div class="cell debug"></div>

            <!-- You would continue filling the 15x15 grid row by row,
                 placing your existing IDs (t7, t8, …, t52, etc.)
                 into the correct logical positions around the board.
                 For now, we keep only the path IDs you already use,
                 and the rest can stay as empty .cell debug divs. -->

        </div>
    </div>

    <!-- Homes (kept separate so tokens don’t vanish) -->
    <div class="homes">

        <!-- Red home (top-left) -->
        <div class="player_board plyr_top_1" data-board-id="1">
            <div class="player_board_white" data-kati-count="4">
                <span class="bg-circle"><i class="kati rd" id="r1" data-step-count="0"></i></span>
                <span class="bg-circle"><i class="kati rd" id="r2" data-step-count="0"></i></span>
                <span class="bg-circle"><i class="kati rd" id="r3" data-step-count="0"></i></span>
                <span class="bg-circle"><i class="kati rd" id="r4" data-step-count="0"></i></span>
            </div>
        </div>

        <!-- Green home (top-right) -->
        <div class="player_board plyr_top_2" data-board-id="2">
            <div class="player_board_white" data-kati-count="4">
                <span class="bg-circle"><i class="kati gn" id="g1" data-step-count="0"></i></span>
                <span class="bg-circle"><i class="kati gn" id="g2" data-step-count="0"></i></span>
                <span class="bg-circle"><i class="kati gn" id="g3" data-step-count="0"></i></span>
                <span class="bg-circle"><i class="kati gn" id="g4" data-step-count="0"></i></span>
            </div>
        </div>

        <!-- Blue home (bottom-left) -->
        <div class="player_board plyr_top_3" data-board-id="3">
            <div class="player_board_white" data-kati-count="4">
                <span class="bg-circle"><i class="kati bl" id="bl1" data-step-count="0"></i></span>
                <span class="bg-circle"><i class="kati bl" id="bl2" data-step-count="0"></i></span>
                <span class="bg-circle"><i class="kati bl" id="bl3" data-step-count="0"></i></span>
                <span class="bg-circle"><i class="kati bl" id="bl4" data-step-count="0"></i></span>
            </div>
        </div>

        <!-- Yellow home (bottom-right) -->
        <div class="player_board plyr_top_4" data-board-id="4">
            <div class="player_board_white" data-kati-count="4">
                <span class="bg-circle"><i class="kati yl" id="y1" data-step-count="0"></i></span>
                <span class="bg-circle"><i class="kati yl" id="y2" data-step-count="0"></i></span>
                <span class="bg-circle"><i class="kati yl" id="y3" data-step-count="0"></i></span>
                <span class="bg-circle"><i class="kati yl" id="y4" data-step-count="0"></i></span>
            </div>
        </div>

    </div>

    <!-- Dice -->
    <div class="ludu_passas" id="dice" data-chal-count="6">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
    </div>

</div>

<!-- Game logic -->
<script src="js/ludo.js"></script>

</body>
</html>
