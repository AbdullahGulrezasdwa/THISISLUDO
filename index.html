<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Pro - Ultimate Edition</title>
    <link rel="stylesheet" href="css/StyleSheet.css">
</head>
<body>
    <div class="main-container">
        <div class="game-board" id="board">
            <img src="images/board.jpg" class="board-bg" alt="Ludo Board">
            
            <div class="piece red" id="r0" onclick="handlePieceClick('red', 0)"><img src="images/rd_kati.png"></div>
            <div class="piece red" id="r1" onclick="handlePieceClick('red', 1)"><img src="images/rd_kati.png"></div>
            <div class="piece red" id="r2" onclick="handlePieceClick('red', 2)"><img src="images/rd_kati.png"></div>
            <div class="piece red" id="r3" onclick="handlePieceClick('red', 3)"><img src="images/rd_kati.png"></div>

            <div class="piece green" id="g0" onclick="handlePieceClick('green', 0)"><img src="images/gn_kati.png"></div>
            <div class="piece green" id="g1" onclick="handlePieceClick('green', 1)"><img src="images/gn_kati.png"></div>
            <div class="piece green" id="g2" onclick="handlePieceClick('green', 2)"><img src="images/gn_kati.png"></div>
            <div class="piece green" id="g3" onclick="handlePieceClick('green', 3)"><img src="images/gn_kati.png"></div>

            <div class="piece yellow" id="y0" onclick="handlePieceClick('yellow', 0)"><img src="images/yl_kati.png"></div>
            <div class="piece yellow" id="y1" onclick="handlePieceClick('yellow', 1)"><img src="images/yl_kati.png"></div>
            <div class="piece yellow" id="y2" onclick="handlePieceClick('yellow', 2)"><img src="images/yl_kati.png"></div>
            <div class="piece yellow" id="y3" onclick="handlePieceClick('yellow', 3)"><img src="images/yl_kati.png"></div>

            <div class="piece blue" id="b0" onclick="handlePieceClick('blue', 0)"><img src="images/bl_kati.png"></div>
            <div class="piece blue" id="b1" onclick="handlePieceClick('blue', 1)"><img src="images/bl_kati.png"></div>
            <div class="piece blue" id="b2" onclick="handlePieceClick('blue', 2)"><img src="images/bl_kati.png"></div>
            <div class="piece blue" id="b3" onclick="handlePieceClick('blue', 3)"><img src="images/bl_kati.png"></div>
        </div>

        <div class="ui-panel">
            <div id="status-display">RED'S TURN</div>
            <div class="dice-section">
                <div id="dice-box" class="dice-box" onclick="rollDice()">⚀</div>
                <p id="instruction">Click Dice to Roll</p>
            </div>
        </div>
    </div>
    <script src="js/ludo.js"></script>
</body>
</html>
